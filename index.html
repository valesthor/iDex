<!doctype html>
<html lang="pt-BR" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>iDex — Despensa virtual</title>
<meta name="description" content="iDex: despensa virtual com prateleiras, controle de estoque e lista de compras. Funciona offline.">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="iDex">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>try{var t=localStorage.getItem('idex-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar"></header>
  <main id="view" tabindex="-1"></main>
  <button id="fab" data-act="new" aria-label="Adicionar produto"></button>
  <nav id="tabs" aria-label="Navegação principal"></nav>
</div>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input id="imp" type="file" accept="application/json,.json" hidden>
<script src="app.js" defer></script>
</body>
</html>
